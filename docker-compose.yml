version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j_db
    ports:
      - "0.0.0.0:7474:7474" # Neo4j Browser
      - "0.0.0.0:7687:7687" # Bolt protocol
    volumes:
      - ./neo4j/data:/data
    environment:
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD} # Ambil password dari file .env
    restart: unless-stopped

  app:
    build: .
    container_name: django_app
    command: gunicorn temupaper_app.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    volumes:
      - ./static_volume:/app/staticfiles # Volume untuk static files
    expose:
      - 8000
    env_file:
      - ./.env
    depends_on:
      - neo4j
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static_volume:/app/staticfiles:ro # 'ro' = read-only
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

volumes:
  static_volume: