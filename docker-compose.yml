version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j_db
    ports:
      - "0.0.0.0:7474:7474" # Neo4j Browser
      - "0.0.0.0:7687:7687" # Bolt protocol
    volumes:
      - ./neo4j/data:/data
    environment:
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_initial__size=1g
      - NEO4J_dbms_memory_heap_max__size=3g
    restart: unless-stopped

  app:
    build: .
    container_name: django_app
    command: gunicorn temupaper_app.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    volumes:
      - ./static_volume:/app/staticfiles # Volume untuk static files
    expose:
      - 8000
    env_file:
      - ./.env
    depends_on:
      - neo4j
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static_volume:/app/staticfiles:ro # 'ro' = read-only
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  static_volume: