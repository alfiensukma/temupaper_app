server {
    listen 80;
    server_name temupaper.com www.temupaper.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        return 301 https://$host$request_uri; # Redirect HTTP ke HTTPS
    }
}

server {
    listen 443 ssl;
    server_name temupaper.com www.temupaper.com;

    ssl_certificate /etc/letsencrypt/live/temupaper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temupaper.com/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}