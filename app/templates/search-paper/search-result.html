{% load unicorn %}

<div class="container mx-auto">
    {% if query %}
        <h1 class="text-2xl md:text-3xl lg:text-4xl font-semibold pb-3">
            Hasil Pencarian untuk "<span class="text-[#4787FA]">{{ query }}</span>"
        </h1>
    {% endif %}

    {% unicorn 'search-result' query=query start_date=start_date end_date=end_date page=page is_loading=is_loading state=state %}
</div>
