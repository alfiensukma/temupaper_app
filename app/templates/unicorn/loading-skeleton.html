<div class="relative w-full">
    <!-- Loading Text -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center gap-5 bg-white p-6 rounded-xl">
        <div class="flex items-center justify-center space-x-2">
            <div class="w-3 h-3 bg-[#4787FA] rounded-full" style="animation: breathing-dots-animation 1.4s infinite ease-in-out;"></div>
            <div class="w-3 h-3 bg-[#4787FA] rounded-full" style="animation: breathing-dots-animation 1.4s infinite ease-in-out; animation-delay: 0.2s;"></div>
            <div class="w-3 h-3 bg-[#4787FA] rounded-full" style="animation: breathing-dots-animation 1.4s infinite ease-in-out; animation-delay: 0.4s;"></div>
        </div>
        <div class="text-center">
            <p class="text-xl font-medium text-gray-700">Sedang memuat data karya ilmiah...</p>
            <p class="text-md text-gray-500">Mohon tunggu sebentar.</p>
        </div>
    </div>

    <!-- Skeleton Items -->
    <div class="flex flex-col gap-6 mt-6">
        {% for _ in get_skeleton_range %}
        <div class="p-6 bg-white rounded-xl animate-pulse">
            <div class="h-7 bg-gray-200 rounded-lg w-4/5 mb-4"></div>
            <div class="flex flex-wrap items-center gap-2 mt-2 mb-3">
                <div class="h-8 w-24 bg-gray-200 rounded-md"></div>
                <div class="h-8 w-24 bg-gray-200 rounded-md"></div>
                <div class="h-8 w-24 bg-gray-200 rounded-md"></div>
            </div>
            <div class="space-y-2">
                <div class="h-4 bg-gray-200 rounded w-full"></div>
                <div class="h-4 bg-gray-200 rounded w-full"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<style>
@keyframes breathing-dots-animation {
    0%, 80%, 100% {
      transform: scale(0.5);
      opacity: 0.5;
    }
    40% {
      transform: scale(1);
      opacity: 1;
    }
  }
</style>
