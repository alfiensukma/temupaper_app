<div class="mt-10 flex justify-start items-center gap-2 font-semibold">
    {% if paginator.has_previous %}
        <span x-on:click="changePage({{ paginator.previous_page_number }})" class="pagination-btn px-4 py-2 bg-white border border-gray-300 rounded hover:bg-gray-100 cursor-pointer" title="Halaman Sebelumnya">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
            </svg>
        </span>
    {% else %}
        <span class="pagination-btn px-4 py-2 bg-gray-100 text-gray-400 border border-gray-300 rounded cursor-not-allowed" title="Halaman Sebelumnya">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
            </svg>
        </span>
    {% endif %}

    {% for num in paginator.page_range %}
        {% if num == '...' %}
            <span class="px-4 py-2 border border-transparent text-gray-500">...</span>
        {% elif paginator.number == num %}
            <span class="px-4 py-2 bg-blue-100 text-blue-600 border border-blue-500 rounded z-10">{{ num }}</span>
        {% else %}
            <span x-on:click="changePage({{ num }})" class="pagination-btn px-4 py-2 bg-white border border-gray-300 rounded hover:bg-gray-100 cursor-pointer">
                {{ num }}
            </span>
        {% endif %}
    {% endfor %}

    {% if paginator.has_next %}
        <span x-on:click="changePage({{ paginator.next_page_number }})" class="pagination-btn px-4 py-2 bg-white border border-gray-300 rounded hover:bg-gray-100 cursor-pointer" title="Halaman Berikutnya">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
            </svg>
        </span>
    {% else %}
        <span class="pagination-btn px-4 py-2 bg-gray-100 text-gray-400 border border-gray-300 rounded cursor-not-allowed" title="Halaman Berikutnya">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
            </svg>
        </span>
    {% endif %}
</div>
