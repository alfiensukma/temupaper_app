{% load unicorn %}
<div>
    <div x-data="{ isOpen: false }"
    @unicorn:updated.window="isOpen = false"
    class="relative">
        <button type="button"
        @click.stop="setTimeout(() => { isOpen = !isOpen }, 10)"
        class="text-center text-base text-blue-600 border border-blue-600 rounded-2xl px-6 py-2 hover:bg-blue-600 hover:text-white w-full flex justify-between items-center min-w-[280px]">
            <span>
                {% if start_date and end_date %}
                    {{ start_date }} - {{ end_date }}
                {% else %}
                    Pilih Rentang Tanggal
                {% endif %}
            </span>
            <svg class="w-4 h-4 inline ml-2 transition-transform" :class="{ 'rotate-180': isOpen }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div x-show="isOpen" @click.outside="isOpen = false" x-cloak class="absolute mt-2 bg-white rounded-lg shadow-lg z-40 p-2">
            <div 
                data-litepicker-container="true" 
                data-component-id="{{ unicorn.id }}">
                </div>
        </div>
    </div>
</div>
