{% load unicorn %}
<div>
    <div class="flex gap-4">
        <div class="relative w-full">
            <input 
                type="text" 
                unicorn:model="start_date"
                placeholder="Tanggal Awal" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg transition-all duration-100 focus:ring-1 focus:ring-[#4787FA] focus:outline-none focus:border-[#4787FA]"
                data-litepicker-start
                data-component-id="{{ unicorn.id }}"
                readonly
            >
            <svg class="absolute right-2 top-3 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
        </div>
        <div class="relative w-full">
            <input 
                type="text" 
                unicorn:model="end_date"
                placeholder="Tanggal Akhir" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg transition-all duration-100 focus:ring-1 focus:ring-[#4787FA] focus:outline-none focus:border-[#4787FA]"
                data-litepicker-end
                data-component-id="{{ unicorn.id }}"
                readonly
            >
            <svg class="absolute right-2 top-3 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
        </div>
    </div>

    <script>
        function initializeDatePickers() {
            const startPicker = document.querySelector('[data-litepicker-start]');
            if (startPicker && !startPicker.litepickerInstance) {
                startPicker.litepickerInstance = new Litepicker({
                    element: startPicker,
                    singleMode: true,
                    format: 'YYYY-MM-DD',
                    autoApply: true,
                    setup: (picker) => {
                        picker.on('selected', (date) => {
                            const componentId = startPicker.getAttribute('data-component-id');
                            if (window.Unicorn) {
                                console.log('Calling update_start_date with:', date.format('YYYY-MM-DD'));
                                window.Unicorn.call(componentId, 'update_start_date', date.format('YYYY-MM-DD'));
                            }
                        });
                    }
                });
            }

            const endPicker = document.querySelector('[data-litepicker-end]');
            if (endPicker && !endPicker.litepickerInstance) {
                endPicker.litepickerInstance = new Litepicker({
                    element: endPicker,
                    singleMode: true,
                    format: 'YYYY-MM-DD',
                    autoApply: true,
                    setup: (picker) => {
                        picker.on('selected', (date) => {
                            const componentId = endPicker.getAttribute('data-component-id');
                            if (window.Unicorn) {
                                console.log('Calling update_end_date with:', date.format('YYYY-MM-DD'));
                                window.Unicorn.call(componentId, 'update_end_date', date.format('YYYY-MM-DD'));
                            }
                        });
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', initializeDatePickers);
        document.addEventListener('unicorn:updated', initializeDatePickers);
    </script>
</div>
