{% load static %}
{% load unicorn %}
<!DOCTYPE html>
<html lang="en"
      x-data="{ dark: JSON.parse(localStorage.getItem('dark') || 'false') }"
      x-init="$watch('dark', val => { document.documentElement.classList.toggle('dark', val); localStorage.setItem('dark', val) })"
      :class="{ 'dark': dark }">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TemuPaper - Temukan Paper mu disini{% endblock %}</title>
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'app/css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css"/>
    {% unicorn_scripts %}
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="{{ body_class|default:'bg-[#f8f9fa]' }} min-h-screen items-center justify-center font-inter">
    {% csrf_token %}
    {% unicorn 'navbar' %}

    <main class="container mx-auto px-6 py-10 md:px-10 lg:px-16">
        <div id="content">
            {% if content_template %}
                {% include content_template %}
            {% else %}
                {% block content %}{% endblock %}
            {% endif %}
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="{% static 'app/node_modules/flowbite/dist/flowbite.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/litepicker.js"></script>

    <script>
function initializeAllDatePickers() {
    document.querySelectorAll('[data-litepicker-container]').forEach(element => {
        // Hapus instance lama jika ada
        if (element.litepickerInstance) {
            element.litepickerInstance.destroy();
        }
        // Inisialisasi Litepicker baru
        element.litepickerInstance = new Litepicker({
            element: element.parentElement.parentElement.querySelector('button'),
            singleMode: false,
            format: 'YYYY-MM-DD',
            autoApply: true,
            setup: (picker) => {
                picker.on('selected', (start, end) => {
                    // Kirim tanggal ke komponen Unicorn
                    const componentId = element.getAttribute('data-component-id');
                    if (window.Unicorn) {
                        window.Unicorn.call(componentId, 'apply_date_filter', start.format('YYYY-MM-DD'), end.format('YYYY-MM-DD'));
                    }
                });
            }
        });
    });
}
document.addEventListener('DOMContentLoaded', initializeAllDatePickers);
document.addEventListener('unicorn:updated', () => {
    initializeAllDatePickers();
    // Paksa AlpineJS scan ulang pada elemen baru
    if (window.Alpine && Alpine.discoverUninitializedComponents) {
        Alpine.discoverUninitializedComponents((el) => {
            Alpine.initializeComponent(el)
        })
    }
});
</script>
</body>
</html>
